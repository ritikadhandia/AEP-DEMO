    \ pattern.test(cleanMobile);\n        }\n\n        // Email validation\n     \
    \   function validateEmail(email) {\n            const pattern = /^[^\\s@]+@[^\\\
    s@]+\\.[^\\s@]+$/;\n            return pattern.test(email);\n        }\n\n   \
    \     // Show error for field\n        function showFieldError(fieldId, show =\
    \ true) {\n            const field = document.getElementById(fieldId);\n     \
    \       const error = document.getElementById(fieldId + 'Error');\n          \
    \  \n            if (show) {\n                field.classList.add('error');\n\
    \                error.style.display = 'block';\n            } else {\n      \
    \          field.classList.remove('error');\n                error.style.display\
    \ = 'none';\n            }\n        }\n\n        // Format mobile number as user\
    \ types\n        document.getElementById('mobile').addEventListener('input', function(e)\
    \ {\n            let value = e.target.value.replace(/\\D/g, ''); // Remove non-digits\n\
    \            \n            if (value.startsWith('91') && !e.target.value.startsWith('+91'))\
    \ {\n                value = '+91 ' + value.substring(2);\n            } else\
    \ if (value.length > 0 && !e.target.value.startsWith('+91')) {\n             \
    \   value = '+91 ' + value;\n            }\n            \n            // Format\
    \ as +91 XXXXX XXXXX\n            if (value.length > 3) {\n                const\
    \ cleanValue = value.replace(/\\+91\\s?/, '');\n                if (cleanValue.length\
    \ <= 10) {\n                    const formatted = cleanValue.replace(/(\\d{5})(\\\
    d{0,5})/, '$1 $2').trim();\n                    e.target.value = '+91 ' + formatted;\n\
    \                }\n            } else {\n                e.target.value = value;\n\
    \            }\n            \n            // Validate on input\n            if\
    \ (e.target.value.length > 4) {\n                const isValid = validateIndianMobile(e.target.value);\n\
    \                showFieldError('mobile', !isValid);\n            }\n        });\n\
    \n        // Real-time validation\n        document.getElementById('firstName').addEventListener('blur',\
    \ function() {\n            showFieldError('firstName', !this.value.trim());\n\
    \        });\n\n        document.getElementById('lastName').addEventListener('blur',\
